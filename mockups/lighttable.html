<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>07 Light Table — Sam Duckworth</title>
    <link rel="stylesheet" href="./switch.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#16181a; --muted:#73777a; --line:rgba(22,24,26,.16); --glass:#edf1ee; --glow:#fffef8; --green:#44685d; --pad:clamp(16px,3vw,44px); }
      *{box-sizing:border-box} body{margin:0;background:var(--glass);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden} button,input{font:inherit;color:inherit}button{cursor:pointer}img{display:block;width:100%;height:100%;object-fit:cover}.mono{font-family:IBM Plex Mono,monospace}
      header{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:14px var(--pad);border-bottom:1px solid var(--line);background:rgba(237,241,238,.9);backdrop-filter:blur(16px)}
      .mark{font:500 11px IBM Plex Mono,monospace;letter-spacing:.14em;text-transform:uppercase}.title{text-align:center}.title b{display:block;font-size:13px}.title span{display:block;color:var(--muted);font:10px IBM Plex Mono,monospace}.count{text-align:right;color:var(--muted);font:11px IBM Plex Mono,monospace}
      .toolbar{position:sticky;top:61px;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--pad);border-bottom:1px solid var(--line);background:rgba(237,241,238,.94);backdrop-filter:blur(16px)}
      .filters{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.filter{border:1px solid var(--line);background:transparent;padding:7px 11px;white-space:nowrap;font:10px IBM Plex Mono,monospace;text-transform:uppercase}.filter.on{background:var(--ink);color:white;border-color:var(--ink)}
      .view-controls{display:flex;align-items:center;gap:10px;color:var(--muted);font:10px IBM Plex Mono,monospace}.view-controls input{width:90px;accent-color:var(--green)}
      main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 112px)}
      .table-wrap{position:relative;padding:var(--pad);background:radial-gradient(circle at 42% 30%,#fff 0,#f8faf6 38%,#e9ede9 100%)}
      .table-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(20,30,25,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(20,30,25,.035) 1px,transparent 1px);background-size:38px 38px}
      .contact{position:relative;display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:clamp(6px,1vw,12px);align-items:start}
      .frame{position:relative;border:0;padding:0;background:#dfe4df;aspect-ratio:var(--ratio,1.4);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform 220ms ease,box-shadow 220ms ease,opacity 220ms ease}.frame:hover,.frame.on{z-index:2;transform:translateY(-3px);box-shadow:0 12px 28px rgba(25,31,27,.2)}.frame.on{outline:3px solid var(--green);outline-offset:2px}.frame img{filter:saturate(.9);transition:filter 220ms}.frame:hover img,.frame.on img{filter:saturate(1.08)}.frame .n{position:absolute;right:5px;bottom:4px;padding:2px 4px;background:rgba(0,0,0,.58);color:white;font:8px IBM Plex Mono,monospace}
      aside{position:sticky;top:112px;height:calc(100vh - 112px);border-left:1px solid var(--line);background:#f4f5f1;display:grid;grid-template-rows:minmax(0,1fr) auto}.inspect{padding:18px;min-height:0;display:flex;flex-direction:column}.preview{min-height:0;flex:1;background:#e0e3df;display:grid;place-items:center;overflow:hidden}.preview img{object-fit:contain}.details{padding:16px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 14px}.details h1{margin:0;font-size:22px;letter-spacing:-.03em}.details .loc{margin:2px 0 0;color:var(--muted);font:10px/1.5 IBM Plex Mono,monospace;text-transform:uppercase}.details .num{grid-row:1/3;grid-column:2;color:var(--muted);font:10px IBM Plex Mono,monospace}.telemetry{border-top:1px solid var(--line);padding:14px 18px 60px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.telemetry span{display:block;color:var(--muted);font:9px IBM Plex Mono,monospace;text-transform:uppercase}.telemetry b{display:block;margin-top:3px;font:500 11px IBM Plex Mono,monospace}
      .empty{grid-column:1/-1;padding:100px 20px;text-align:center;color:var(--muted);font:11px IBM Plex Mono,monospace}
      @media(max-width:840px){header{grid-template-columns:1fr auto}.title{display:none}.toolbar{top:51px}.view-controls{display:none}main{display:block}.table-wrap{padding:14px 14px 150px}.contact{--cols:3!important}aside{position:fixed;inset:auto 0 52px;height:132px;z-index:40;border:1px solid var(--line);grid-template-columns:120px 1fr;grid-template-rows:1fr}.inspect{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:10px}.preview{height:110px}.details{padding:4px 0}.details h1{font-size:17px}.details .num{display:none}.telemetry{display:none}}
      @media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
    </style>
  </head>
  <body>
    <header><a class="mark" href="./index.html">SD / Archive</a><div class="title"><b>LIGHT TABLE</b><span>Curate by looking, not filing</span></div><div class="count" aria-live="polite">Loading frames</div></header>
    <div class="toolbar"><div class="filters" role="group" aria-label="Filter archive"><button class="filter on" data-filter="all">All</button><button class="filter" data-filter="Northern Beaches">Near</button><button class="filter" data-filter="Europe">Far</button><button class="filter" data-filter="portrait">Portrait</button><button class="filter" data-filter="drone">Drone</button></div><label class="view-controls">Density <input id="density" type="range" min="4" max="9" value="6" /></label></div>
    <main>
      <section class="table-wrap" aria-label="Photo contact sheet"><div class="contact"></div></section>
      <aside aria-label="Selected photograph"><div class="inspect"><div class="preview"><img alt="" /></div><div class="details"><div><h1>Select a frame</h1><p class="loc">Hover or tap the archive</p></div><span class="num">—</span></div></div><div class="telemetry"><div><span>Year</span><b data-year>—</b></div><div><span>Altitude</span><b data-alt>—</b></div><div><span>Latitude</span><b data-lat>—</b></div><div><span>Longitude</span><b data-lon>—</b></div></div></aside>
    </main>
    <script type="module">
      import { img, photos, switcher } from "./mock.js";
      const rows=await photos(); let active="all"; let visible=[]; let selected=null;
      const grid=document.querySelector(".contact"); const count=document.querySelector(".count");
      function subset(){return rows.filter(p=>active==="all"||p.region===active||p.aspect===active||(active==="drone"&&p.alt>0));}
      function render(){visible=subset();count.textContent=`${visible.length} / ${rows.length} frames`;grid.innerHTML=visible.map((p,i)=>`<button class="frame" data-i="${i}" style="--ratio:${p.ratio||1.4}" aria-label="Inspect ${p.title}, ${p.location}"><img src="${img(p,420,68)}" alt="" loading="lazy"><span class="n">${String(i+1).padStart(3,"0")}</span></button>`).join("")||'<p class="empty">No frames in this view.</p>';select(visible[0],0);}
      function fmt(v,d=3){return Number.isFinite(v)?Number(v).toFixed(d):"—"}
      function select(p,i){if(!p)return;selected=p;document.querySelectorAll(".frame.on").forEach(e=>e.classList.remove("on"));document.querySelector(`.frame[data-i="${i}"]`)?.classList.add("on");const preview=document.querySelector(".preview img");preview.src=img(p,1000,82);preview.alt=`${p.title}, ${p.location}`;document.querySelector(".details h1").textContent=p.title;document.querySelector(".details .loc").textContent=`${p.location} / ${p.region}`;document.querySelector(".details .num").textContent=String(i+1).padStart(3,"0");document.querySelector("[data-year]").textContent=p.year??"Archive";document.querySelector("[data-alt]").textContent=p.alt!=null?`${Math.round(p.alt)} m`:"Ground";document.querySelector("[data-lat]").textContent=fmt(p.lat);document.querySelector("[data-lon]").textContent=fmt(p.lon);}
      grid.addEventListener("pointerover",e=>{const b=e.target.closest(".frame");if(b)select(visible[+b.dataset.i],+b.dataset.i)});grid.addEventListener("click",e=>{const b=e.target.closest(".frame");if(b)select(visible[+b.dataset.i],+b.dataset.i)});
      document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelector(".filter.on")?.classList.remove("on");b.classList.add("on");active=b.dataset.filter;render()}));
      document.querySelector("#density").addEventListener("input",e=>grid.style.setProperty("--cols",e.target.value));
      render();switcher("lighttable");
    </script>
  </body>
</html>
