<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3eee5" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Self-hosted heading font, preloaded so it's ready before first paint
         (the loading skeleton's "Recent Work" shows in Bebas Neue, not a fallback). -->
    <link
      rel="preload"
      href="/fonts/bebas-neue.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Sam Duckworth Photography</title>
    <meta
      name="description"
      content="Northern Beaches drone and travel photography by Sam Duckworth."
    />

    <!-- Social sharing (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sam Duckworth Photography" />
    <meta property="og:title" content="Sam Duckworth Photography" />
    <meta
      property="og:description"
      content="Northern Beaches drone and travel photography."
    />
    <meta property="og:url" content="https://sdwebsite-rho.vercel.app/" />
    <meta property="og:image" content="https://sdwebsite-rho.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sam Duckworth Photography" />
    <meta
      name="twitter:description"
      content="Northern Beaches drone and travel photography."
    />
    <meta name="twitter:image" content="https://sdwebsite-rho.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
