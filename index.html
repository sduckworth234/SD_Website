<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) — GA4. One tag for the whole SPA (this file serves
         every route). Page-view tracking is automatic on load. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PJ829H05BE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-PJ829H05BE");
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3eee5" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Warm the connection to Supabase Storage so the first gallery image
         (and the LCP hero) starts downloading sooner. -->
    <link rel="preconnect" href="https://krixuiimabosiorzxzju.supabase.co" crossorigin />
    <!-- Self-hosted heading font, preloaded so it's ready before first paint
         (the loading skeleton's "Recent Work" shows in Bebas Neue, not a fallback). -->
    <link
      rel="preload"
      href="/fonts/bebas-neue.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Sam Duckworth Photography — Aerial &amp; Landscape, Northern Beaches</title>
    <meta
      name="description"
      content="Aerial drone and landscape photography by Sam Duckworth, based on Sydney's Northern Beaches — fine-art prints and commissions."
    />
    <link rel="canonical" href="https://www.samduckworth.com/" />

    <!-- Social sharing (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sam Duckworth Photography" />
    <meta property="og:title" content="Sam Duckworth Photography — Aerial &amp; Landscape" />
    <meta
      property="og:description"
      content="Aerial drone and landscape photography from Sydney's Northern Beaches and beyond."
    />
    <meta property="og:url" content="https://www.samduckworth.com/" />
    <meta property="og:image" content="https://www.samduckworth.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sam Duckworth Photography — Aerial &amp; Landscape" />
    <meta
      name="twitter:description"
      content="Aerial drone and landscape photography from Sydney's Northern Beaches and beyond."
    />
    <meta name="twitter:image" content="https://www.samduckworth.com/og-image.png" />

    <!-- Structured data: who + what, for search + local SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.samduckworth.com/#sam",
            "name": "Sam Duckworth",
            "jobTitle": "Photographer & Videographer",
            "url": "https://www.samduckworth.com/",
            "image": "https://www.samduckworth.com/og-image.png",
            "sameAs": ["https://instagram.com/sam.duckworth"]
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://www.samduckworth.com/#business",
            "name": "Sam Duckworth Photography",
            "image": "https://www.samduckworth.com/og-image.png",
            "url": "https://www.samduckworth.com/",
            "founder": { "@id": "https://www.samduckworth.com/#sam" },
            "areaServed": ["Northern Beaches", "Sydney", "New South Wales", "Australia"],
            "knowsAbout": ["Aerial photography", "Drone photography", "Landscape photography", "Travel photography"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
