<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) — GA4. One tag for the whole SPA (this file serves
         every route). Page-view tracking is automatic on load.
         NOTE: the inline snippet below is allow-listed by a sha256 hash in the
         vercel.json Content-Security-Policy — if you change even a character of
         it, recompute the hash (sha256, base64, of the exact text between the
         script tags) or GA silently stops loading. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PJ829H05BE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-PJ829H05BE", { send_page_view: false });
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3eee5" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Set the theme before the first paint, so a dark-mode visitor never sees
         a flash of the light page. Must run inline and synchronously; its
         sha256 is allow-listed in vercel.json's CSP, so if you edit this block
         you must recompute that hash or the script will be blocked. Mirrors
         src/lib/theme.ts — keep the "sd-theme" key in sync. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("sd-theme");
          var t = s === "light" || s === "dark" ? s
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          if (t === "dark") {
            document.querySelector('meta[name="theme-color"]').content = "#0b0b0c";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Warm the connection to Supabase Storage so the first gallery image
         (and the LCP hero) starts downloading sooner. -->
    <link rel="preconnect" href="https://krixuiimabosiorzxzju.supabase.co" crossorigin />
    <!-- Self-hosted fonts, preloaded so they're ready before first paint (the
         loading skeleton's "Recent Work" shows in Archivo, not a fallback).
         Only the latin subsets are preloaded — latin-ext loads on demand. -->
    <link
      rel="preload"
      href="/fonts/archivo-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bebas-neue.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Everything between SEO:START and SEO:END is REGENERATED PER ROUTE at
         build time by scripts/prerender.mjs, which writes a static HTML file
         for /, /galleries, /galleries/<place>, /shop, /shop/<slug>, /work,
         /map and the policy pages. Edit the defaults here freely — they are
         what ships if the prerender is skipped (no Supabase env) — but keep
         the two marker comments intact or the prerender bails out. -->
    <!-- SEO:START -->
    <title>Sam Duckworth Photography — Aerial &amp; Landscape, Northern Beaches</title>
    <meta
      name="description"
      content="Aerial drone and landscape photography by Sam Duckworth, based on Sydney's Northern Beaches — fine-art prints and commissions."
    />
    <link rel="canonical" href="https://www.samduckworth.com/" />

    <!-- Social sharing (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sam Duckworth Photography" />
    <meta property="og:title" content="Sam Duckworth Photography — Aerial &amp; Landscape" />
    <meta
      property="og:description"
      content="Aerial drone and landscape photography from Sydney's Northern Beaches and beyond."
    />
    <meta property="og:url" content="https://www.samduckworth.com/" />
    <!-- Share preview = the CURRENT landing hero: /api/og-image resolves the
         admin-chosen hero (same logic as the home page) and redirects to its
         image, so iMessage/WhatsApp/Facebook cards always match the site. -->
    <meta property="og:image" content="https://www.samduckworth.com/api/og-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sam Duckworth Photography — Aerial &amp; Landscape" />
    <meta
      name="twitter:description"
      content="Aerial drone and landscape photography from Sydney's Northern Beaches and beyond."
    />
    <meta name="twitter:image" content="https://www.samduckworth.com/api/og-image" />

    <!-- Structured data: who + what, for search + local SEO. LocalBusiness (not
         just ProfessionalService) with a locality, phone and email is what
         earns a local pack / knowledge panel for "drone photographer northern
         beaches". The prerender regenerates this per route and pulls the phone
         and email from site_content, so these values are the fallback. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.samduckworth.com/#sam",
            "name": "Sam Duckworth",
            "jobTitle": "Photographer & Videographer",
            "url": "https://www.samduckworth.com/",
            "image": "https://www.samduckworth.com/og-image.png",
            "sameAs": ["https://www.instagram.com/sam.duckworth/"]
          },
          {
            "@type": ["LocalBusiness", "ProfessionalService"],
            "@id": "https://www.samduckworth.com/#business",
            "name": "Sam Duckworth Photography",
            "image": "https://www.samduckworth.com/og-image.png",
            "url": "https://www.samduckworth.com/",
            "founder": { "@id": "https://www.samduckworth.com/#sam" },
            "email": "samduckworthphoto@gmail.com",
            "telephone": "0423 638 403",
            "priceRange": "$$",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Northern Beaches, Sydney",
              "addressRegion": "NSW",
              "addressCountry": "AU"
            },
            "areaServed": ["Northern Beaches", "Sydney", "New South Wales", "Australia"],
            "knowsAbout": ["Aerial photography", "Drone photography", "Landscape photography", "Travel photography"],
            "sameAs": ["https://www.instagram.com/sam.duckworth/"]
          }
        ]
      }
    </script>
    <!-- SEO:END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
